name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: stowflow
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: root
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d stowflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Test API
        working-directory: stowflow-api
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5433/stowflow
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: root
          JWT_SECRET: StowFlowCiSecretKey2026MustBe256BitsMinimumForTests!!
        run: ./mvnw -B test package -DskipTests=false
      - name: Package API
        working-directory: stowflow-api
        run: ./mvnw -B package -DskipTests

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: inventra-web/package-lock.json
      - name: Install & lint & build
        working-directory: inventra-web
        run: |
          npm ci
          npm run lint
          npm run build
