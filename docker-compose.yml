# StowFlow — full stack: PostgreSQL + Spring Boot API + Next.js frontend
# Usage: docker compose up --build
# Stop:  docker compose down  (add -v to wipe database volume)

name: stowflow

services:
  # ── 1/3 Database ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: stowflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: stowflow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - stowflow_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d stowflow"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # ── 2/3 Backend (Spring Boot) ────────────────────────────────
  stowflow-api:
    build:
      context: ./stowflow-api
      dockerfile: Dockerfile
    container_name: stowflow-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    env_file:
      - .env.docker
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/stowflow
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: root
      JWT_SECRET: StowFlowDevSecretKey2026ChangeInProductionMustBe256BitsMinimum!!
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      INVENTRA_GEMINI_ENABLED: ${INVENTRA_GEMINI_ENABLED:-true}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/actuator/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s

  # ── 3/3 Frontend (Next.js) ───────────────────────────────────
  inventra-web:
    build:
      context: ./inventra-web
      dockerfile: Dockerfile
      args:
        API_PROXY_TARGET: http://stowflow-api:8000
    container_name: stowflow-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      API_PROXY_TARGET: http://stowflow-api:8000
    depends_on:
      postgres:
        condition: service_healthy
      stowflow-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000 >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s

volumes:
  stowflow_pg_data:
