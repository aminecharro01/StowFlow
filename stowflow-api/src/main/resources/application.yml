spring:
  config:
    import: optional:classpath:application-local.yml
  application:
    name: stowflow-api
  datasource:
    url: jdbc:postgresql://localhost:5432/stowflow
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  port: 8000

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  cors:
    allowed-origins: "http://localhost:3000,http://localhost:3001,http://127.0.0.1:3000,http://127.0.0.1:3001"
  swagger:
    enabled: true

inventra:
  jwt:
    secret: ${JWT_SECRET:StowFlowDevSecretKey2026ChangeInProductionMustBe256BitsMinimum!!}
    access-token-expiration: 30m
  gemini:
    enabled: ${INVENTRA_GEMINI_ENABLED:true}
    generate-replies: true
    api-key: ${GEMINI_API_KEY:}
    model: gemini-2.5-flash
    timeout: 30s
    max-output-tokens-intent: 512
    max-output-tokens-reply: 350
  seed-demo: true
  legacy-schema-fixer: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
